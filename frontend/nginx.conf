# HTTP: serve ACME challenge, redirect everything else to HTTPS
server {
    listen 80;
    server_name asset.datamou.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: the app
server {
    listen 443 ssl;
    http2 on;
    server_name asset.datamou.uz;

    ssl_certificate     /etc/letsencrypt/live/asset.datamou.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/asset.datamou.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /usr/share/nginx/html;
    index index.html;

    # API -> backend container
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # FastAPI docs
    location = /docs { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location = /openapi.json { proxy_pass http://backend:8000; proxy_set_header Host $host; }
    location /redoc { proxy_pass http://backend:8000; proxy_set_header Host $host; }

    # Cache build assets aggressively
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
