services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: assetvault
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@db:5432/assetvault
      SYNC_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/assetvault
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      # No SEED_PASSWORD default here — seeding is not wired into prod startup.
      # entrypoint.sh still runs `alembic upgrade head` on every boot.
      # When seeding manually, pass -e SEED_PASSWORD=... (required by seed.py).
      SKIP_SEED: "1"
      # Domain → CORS regex allows https://{slug,app,admin,apex}.{BASE_DOMAIN}.
      # Do not set a wildcard origin string (incompatible with allow_credentials).
      BASE_DOMAIN: ${BASE_DOMAIN:-assetvault.uz}
      LEGACY_BASE_DOMAIN: ${LEGACY_BASE_DOMAIN:-datamou.uz}
      APP_SUBDOMAIN: ${APP_SUBDOMAIN:-app}
      PLATFORM_SUBDOMAIN: ${PLATFORM_SUBDOMAIN:-admin}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY must be set}
      GROQ_API_URL: https://api.groq.com/openai/v1/chat/completions
      GROQ_MODEL: llama-3.3-70b-versatile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_BASE_DOMAIN: ${BASE_DOMAIN:-assetvault.uz}
        VITE_APP_SUBDOMAIN: ${APP_SUBDOMAIN:-app}
    restart: unless-stopped
    ports:
      # Unprivileged nginx listens on 8080/8443 inside the container
      - "80:8080"
      - "443:8443"
    environment:
      # Rendered into server_name (space-separated). Tenant SPA + demo host.
      # Legacy datamou hosts are NOT listed here — they 301 via NGINX_LEGACY_REDIRECT_NAMES.
      NGINX_SERVER_NAMES: ${NGINX_SERVER_NAMES:-app.assetvault.uz assetvault.uz demo.assetvault.uz *.assetvault.uz}
      # Platform operator console hosts — {PLATFORM_SUBDOMAIN}.{domain}, matching
      # the CORS origins the backend derives. Must be non-empty (server_name needs
      # at least one name) and must not overlap NGINX_SERVER_NAMES.
      NGINX_PLATFORM_SERVER_NAMES: ${NGINX_PLATFORM_SERVER_NAMES:-admin.assetvault.uz}
      # Permanent 301 target for VC/bookmark hosts (asset.datamou.uz).
      NGINX_LEGACY_REDIRECT_NAMES: ${NGINX_LEGACY_REDIRECT_NAMES:-asset.datamou.uz}
      NGINX_CANONICAL_APP_ORIGIN: ${NGINX_CANONICAL_APP_ORIGIN:-https://app.assetvault.uz}
      # Let's Encrypt live/ directory name — may differ from BASE_DOMAIN (transition / wildcard).
      TLS_CERT_NAME: ${TLS_CERT_NAME:-assetvault.uz}
      # Only substitute these; leave nginx $host / $uri / $scheme / … intact.
      # Substring match on env var names (see nginx 20-envsubst-on-templates.sh).
      NGINX_ENVSUBST_FILTER: NGINX_SERVER_NAMES|NGINX_PLATFORM_SERVER_NAMES|NGINX_LEGACY_REDIRECT_NAMES|NGINX_CANONICAL_APP_ORIGIN|TLS_CERT_NAME
    volumes:
      # No finished nginx.conf mount — envsubst writes /etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - backend

  certbot:
    image: certbot/certbot
    profiles: ["tools"]
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  pgdata:
